<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090f1c">
<title>KCYM 4C · Laboratorio de color</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="access-locked">
<main id="access-gate" class="access-gate"><section class="access-card panel" aria-live="polite"><h1>KCYM <span class="accent">4C</span></h1><p class="notice">Comprobando tu sesión…</p></section></main>
<aside class="sidebar" id="sidebar">
 <button class="brand" data-view="inicio"><span class="brand-icon"><i></i></span><span><strong>KCYM <span class="accent">4C</span></strong><small>LABORATORIO DIGITAL</small></span></button>
 <nav id="nav" aria-label="Navegación principal"></nav>
 <div class="side-bottom"><div class="workspace"><div class="workspace-icon" id="workspace-icon"></div><span><strong>Mi laboratorio</strong><small id="workspace-label">Espacio de demostración</small></span></div><button class="profile" id="profile"></button></div>
</aside>
<div class="shell">
 <header class="topbar">
  <button class="icon-button mobile-menu" id="menu" aria-label="Abrir menú"></button>
  <div class="crumb"><span>Mi espacio</span><b>›</b><strong id="crumb">Panel de inicio</strong></div>
  <div class="top-actions"><button class="search-button" id="search"></button><button class="icon-button" id="theme" aria-label="Cambiar tema"></button><button class="icon-button notification" id="notification" aria-label="Actividad"></button><button class="avatar top-avatar" id="account" aria-label="Mi cuenta">CL</button></div>
 </header>
 <main id="main"></main>
</div>
<datalist id="measurement-backings"><option value="Blanco"></option><option value="Negro"></option></datalist>
<datalist id="illuminants"><option value="D50"></option><option value="D65"></option><option value="D55"></option><option value="D75"></option><option value="A"></option><option value="F2"></option><option value="F11"></option></datalist>
<datalist id="paired-illuminants"><option value="D50 / 2°"></option><option value="D50 / 10°"></option><option value="D65 / 2°"></option><option value="D65 / 10°"></option><option value="D55 / 2°"></option><option value="D55 / 10°"></option><option value="D75 / 2°"></option><option value="D75 / 10°"></option><option value="A / 2°"></option><option value="A / 10°"></option><option value="F2 / 2°"></option><option value="F2 / 10°"></option><option value="F11 / 2°"></option><option value="F11 / 10°"></option></datalist>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
